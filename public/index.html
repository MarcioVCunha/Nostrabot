<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090612" />
    <title>Nostrabot</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="dark">
    <div id="appShell" class="app-shell">
      <header class="app-topbar">
        <div class="brand-block">
          <img class="brand-mark" src="./favicon.svg" alt="" width="28" height="28" />
          <div>
            <h1>Nostrabot</h1>
            <p class="brand-tagline">Timer ponderado para as gravações</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="themeToggle" class="secondary" type="button">
            Tema: Místico
          </button>
          <button id="changeAdminKeyButton" class="secondary" type="button">
            Chave
          </button>
          <a class="footer-link" href="./patch">Novidades</a>
          <span class="footer-version">v1.10.0</span>
        </div>
      </header>

      <div class="app-grid">
        <aside class="panel panel-left glass" aria-label="Biblioteca de áudios">
          <div class="panel-header">
            <h2>Biblioteca</h2>
            <span id="audioDropdownSummary" class="panel-count">0</span>
          </div>

          <div
            id="dropZone"
            class="drop-zone drop-zone--compact"
            tabindex="0"
            aria-label="Área para soltar arquivos de áudio"
          >
            <p>Arraste áudios aqui ou escolha arquivos.</p>
            <div class="row">
              <input id="audioInput" type="file" accept="audio/*" multiple />
              <button id="saveButton" type="button">Enviar</button>
              <button id="recordButton" class="secondary" type="button">
                Microfone
              </button>
            </div>
          </div>
          <div id="uploadProgressList" class="upload-progress-list" hidden></div>
          <p id="uploadStatus" class="status" role="status" aria-live="polite"></p>

          <div class="list-toolbar">
            <input
              id="audioSearch"
              type="search"
              placeholder="Buscar..."
              aria-label="Buscar áudios"
            />
            <button id="trashToggleButton" class="secondary" type="button">
              Lixeira
            </button>
          </div>
          <p class="hint" id="listHint">Número = peso no sorteio.</p>
          <ul id="audioList" class="audio-list audio-list--compact"></ul>
        </aside>

        <section class="panel panel-center glass" aria-label="Palco do timer">
          <div class="timer-stage">
            <div class="timer-widget timer-widget--stage">
              <svg
                id="timerSvg"
                class="timer-ring"
                width="400"
                height="400"
                viewBox="0 0 400 400"
                aria-label="Progresso do timer"
              >
                <circle class="ring-bg" cx="200" cy="200" r="180"></circle>
                <circle
                  id="timerProgressRing"
                  class="ring-progress"
                  cx="200"
                  cy="200"
                  r="180"
                ></circle>
              </svg>
              <div class="timer-center">
                <div
                  id="timeRemainingLabel"
                  class="time-remaining time-remaining--xl"
                >
                  00:30
                </div>
                <div id="timerStateLabel" class="time-caption">Pronto</div>
              </div>
            </div>

            <div id="timerIdleControls" class="timer-idle-controls">
              <div class="stage-controls">
                <label class="field">
                  <span>Tempo</span>
                  <input
                    id="timerAmount"
                    type="number"
                    min="1"
                    value="30"
                    aria-label="Duração do timer"
                  />
                </label>
                <label class="field">
                  <span>Unidade</span>
                  <select id="timerUnit" aria-label="Unidade de tempo">
                    <option value="seconds">Segundos</option>
                    <option value="minutes">Minutos</option>
                  </select>
                </label>
              </div>

              <div class="row timer-options">
                <label class="check">
                  <input id="timerAutoRepeat" type="checkbox" />
                  Repetir
                </label>
                <label class="check">
                  <input id="timerNoRepeat" type="checkbox" />
                  Sem repetir até todos
                </label>
                <label class="check">
                  <input id="timerNotify" type="checkbox" checked />
                  Notificar
                </label>
              </div>

              <button id="startRandomTimerButton" class="cta-start" type="button">
                Iniciar timer
              </button>
              <p
                id="timerSetupStatus"
                class="status"
                role="status"
                aria-live="polite"
              ></p>
            </div>

            <div id="timerRunControls" class="timer-screen-actions" hidden>
              <button id="pauseResumeTimerButton" class="secondary" type="button">
                Pausar
              </button>
              <button
                id="cancelRandomTimerButton"
                class="secondary"
                type="button"
                disabled
              >
                Cancelar
              </button>
              <button
                id="playFallbackButton"
                class="play-fallback"
                type="button"
                hidden
              >
                Toque para reproduzir
              </button>
            </div>
          </div>

          <div class="stage-history">
            <div class="panel-header">
              <h2>Histórico</h2>
            </div>
            <ul id="playHistoryList" class="history-list"></ul>
          </div>
        </section>
      </div>
    </div>

    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
